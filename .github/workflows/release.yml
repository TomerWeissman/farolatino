# V2 release pipeline. Triggered when a tag like `v0.2.0` is pushed:
#
#   git tag v0.2.0
#   git push --tags
#
# Two builds run in parallel — Mac .app / .dmg and Windows .exe installer.
# Both are attached to the GitHub Release at
# https://github.com/<owner>/<repo>/releases. FaroLatino's team downloads
# whichever installer matches their OS.
#
# Free under your tier:
#   - Public repos: unlimited build minutes
#   - Private repos: 2,000 minutes/month free (Mac counts 10x, Win 2x);
#     each release costs ~50 effective minutes -> ~40 releases/month free.
#
# No code signing — first launch shows Gatekeeper / SmartScreen warning,
# user does the right-click-Open / "Run anyway" dance once.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed to create the release + upload assets

jobs:
  # ─── Mac build ───────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-14  # Apple Silicon — current default
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js (for the frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install frontend deps + build web/out
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Run Mac build (py2app + .dmg)
        run: ./packaging/build_mac.sh

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/FaroAI-v*.dmg
          if-no-files-found: error

  # ─── Windows build ──────────────────────────────────────────────────
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js (for the frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install frontend deps + build web/out
        working-directory: web
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Run Windows build (PyInstaller + NSIS)
        shell: pwsh
        run: .\packaging\build_windows.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/FaroAI-Setup-v*.exe
          if-no-files-found: error

  # ─── Code-only update zip (in-app patch path) ───────────────────────
  # Built on Linux (1x billing multiplier) in parallel with the heavy
  # installers. Produces faroai-code-vX.Y.Z.zip (~1–5 MB) — what the
  # in-app updater pulls when a v0.4.1+ user clicks "Check for updates".
  build-codezip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js (for the frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install frontend deps + build web/out
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build code zip
        run: ./packaging/build_code_zip.sh "${{ github.ref_name }}"

      - name: Upload code zip
        uses: actions/upload-artifact@v4
        with:
          name: code-zip
          path: dist/faroai-code-v*.zip
          if-no-files-found: error

  # ─── Publish to GitHub Releases ─────────────────────────────────────
  release:
    needs: [build-mac, build-windows, build-codezip]
    runs-on: ubuntu-latest
    steps:
      - name: Download Mac installer
        uses: actions/download-artifact@v4
        with:
          name: mac-installer
          path: ./artifacts

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./artifacts

      - name: Download code zip
        uses: actions/download-artifact@v4
        with:
          name: code-zip
          path: ./artifacts

      - name: Compute SHA256 checksums + write release notes
        # core/updater.py reads SHA256s from release notes via regex when
        # the user clicks "Check for updates" — verifies the downloaded
        # zip matches before extracting into the user-data overlay dir.
        # Defense-in-depth on top of HTTPS to GitHub.
        run: |
          cd ./artifacts
          {
            echo "## Install (first time / coming from v0.4.0 or older)"
            echo
            echo "**Mac:** download \`FaroAI-${{ github.ref_name }}.dmg\`, drag to Applications."
            echo "First launch: right-click FaroAI.app → Open → confirm Gatekeeper warning."
            echo
            echo "**Windows:** download \`FaroAI-Setup-${{ github.ref_name }}.exe\`, run it."
            echo "First launch: SmartScreen warns 'unrecognized app' → click 'More info' → 'Run anyway'."
            echo
            echo "## Update in-app (already on v0.4.1+)"
            echo
            echo "Open the app → Connections → **Check for updates**. Pulls"
            echo "\`faroai-code-${{ github.ref_name }}.zip\` (~1–5 MB), verifies the SHA below,"
            echo "applies it, and restarts. No reinstall."
            echo
            echo "## Checksums"
            echo
            echo '```'
            for f in FaroAI-*.dmg FaroAI-Setup-*.exe faroai-code-*.zip; do
              [ -f "$f" ] || continue
              sha=$(shasum -a 256 "$f" | cut -d' ' -f1)
              echo "$f: $sha"
            done
            echo '```'
          } > ../release-notes.md
          cat ../release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            ./artifacts/FaroAI-v*.dmg
            ./artifacts/FaroAI-Setup-v*.exe
            ./artifacts/faroai-code-v*.zip
          fail_on_unmatched_files: true
          generate_release_notes: false
