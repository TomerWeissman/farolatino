# Grey + white palette, minimal chrome — see SETUP.md
[theme]
base = "light"
primaryColor = "#525252"          # dark grey accents (focus rings, links)
backgroundColor = "#ffffff"       # main canvas
secondaryBackgroundColor = "#f5f5f5"  # sidebar, code blocks
textColor = "#1a1a1a"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Keep the headless flag from the launcher consistent
headless = true

[client]
toolbarMode = "minimal"           # hides the dev menu/footer
