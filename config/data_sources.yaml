# Data source registry
# Defines available sources and their configuration
# FaroLatino team can add new sources here without modifying code

sources:
  chartmetric:
    type: api
    base_url: "https://api.chartmetric.com"
    auth:
      method: refresh_token
      token_endpoint: "/api/token"
      token_ttl_seconds: 3600
      env_var: "CHARTMETRIC_REFRESH_TOKEN"
    rate_limit:
      type: sliding_window
    enabled: true

  farolatino_internal:
    type: file
    path: "./data/internal/"
    formats: ["csv", "json"]
    description: "FaroLatino internal data (CPMs, revenue, deal history)"
    enabled: true

  # Future sources — disabled by default
  # To enable: set enabled to true and configure auth
  spotify_api:
    type: api
    base_url: "https://api.spotify.com/v1"
    description: "Save-to-stream ratios for bot detection (D6)"
    enabled: false

  google_search:
    type: scraper
    description: "Web scraping for press coverage, contact info, age estimation"
    enabled: false

  luminate:
    type: api
    description: "Industry sales and streaming analytics"
    enabled: false

  viberate:
    type: api
    description: "Artist analytics and market intelligence"
    enabled: false

  artist_tools:
    type: api
    description: "Spotify analytics and playlist tracking"
    enabled: false

  songstats:
    type: api
    description: "Multi-platform streaming analytics"
    enabled: false
