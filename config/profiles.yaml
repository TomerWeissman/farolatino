# Search profiles — named weight presets for different business intents
# Weights must sum to 1.0 across all 7 dimensions
# filter_overrides merge with (and override) the base search_criteria.yaml

default_weights:
  momentum: 0.25
  geographic_fit: 0.20
  revenue_potential: 0.20
  timing: 0.15
  content_velocity: 0.08
  engagement_quality: 0.07
  platform_diversification: 0.05

profiles:
  emerging_momentum:
    name: "Emerging Artist with Momentum"
    description: "Find fast-growing unsigned artists in early career stages"
    weights:
      momentum: 0.35
      geographic_fit: 0.20
      revenue_potential: 0.15
      timing: 0.15
      content_velocity: 0.05
      engagement_quality: 0.05
      platform_diversification: 0.05
    filter_overrides:
      career_stages: ["undiscovered", "developing"]
      career_trends: ["rising", "explosive growth"]

  revenue_focus:
    name: "Revenue Focus"
    description: "Prioritize artists with high projected revenue potential"
    weights:
      momentum: 0.15
      geographic_fit: 0.20
      revenue_potential: 0.35
      timing: 0.10
      content_velocity: 0.05
      engagement_quality: 0.10
      platform_diversification: 0.05

  latam_expansion:
    name: "LATAM Expansion"
    description: "Find artists with strong presence in target LATAM growth markets"
    weights:
      momentum: 0.20
      geographic_fit: 0.35
      revenue_potential: 0.15
      timing: 0.10
      content_velocity: 0.08
      engagement_quality: 0.07
      platform_diversification: 0.05
    filter_overrides:
      countries: ["CO", "PE", "EC", "BO", "PY"]
