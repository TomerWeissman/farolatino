# Revenue model thresholds for D3 scoring normalization
# These define what score maps to what annual revenue projection
revenue_score_thresholds:
  # Annual projected revenue → D3 score
  # Linear interpolation between these points
  0: 0
  1000: 20
  5000: 40
  15000: 60
  50000: 80
  150000: 100
