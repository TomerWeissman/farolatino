# FaroLatino market tier classification
# Defines how geographic fit is scored (D2)
# PLACEHOLDER — Julio must define final tier assignments
#
# Tier 1 = core markets (highest CPMs, strongest distribution infra)
# Tier 2 = growth markets (good potential, building presence)
# Tier 3 = emerging/opportunistic (lower CPMs, less infra)

tier_1:
  - "MX"   # Mexico
  - "CO"   # Colombia
  - "AR"   # Argentina
  - "US"   # United States (Latin market)
  - "ES"   # Spain

tier_2:
  - "CL"   # Chile
  - "PE"   # Peru
  - "EC"   # Ecuador
  - "BR"   # Brazil

tier_3:
  - "BO"   # Bolivia
  - "PY"   # Paraguay
  - "UY"   # Uruguay
  - "CR"   # Costa Rica
  - "PA"   # Panama
  - "DO"   # Dominican Republic
  - "GT"   # Guatemala
  - "HN"   # Honduras
  - "SV"   # El Salvador
  - "NI"   # Nicaragua
  - "VE"   # Venezuela
  - "CU"   # Cuba
  - "PR"   # Puerto Rico

# Scoring weights per tier (used by D2 Geographic Fit scorer)
tier_weights:
  tier_1: 1.0
  tier_2: 0.7
  tier_3: 0.4
  unclassified: 0.2
