<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>skill_input</title>
<style>
  /* Reset + match the host page */
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #1a1a1a;
    background: transparent;
  }

  .wrap {
    position: relative;
    width: 100%;
  }

  textarea {
    width: 100%;
    border: 1px solid #d4d4d4;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    font-family: inherit;
    color: #1a1a1a;
    background: #ffffff;
    resize: none;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    overflow-y: auto;
  }
  textarea::placeholder { color: #a3a3a3; }
  textarea:focus {
    border-color: #525252;
    box-shadow: 0 0 0 3px rgba(82,82,82,0.08);
  }

  .hint {
    color: #a3a3a3;
    font-size: 12px;
    padding: 6px 4px 0 4px;
    user-select: none;
  }

  /* Drop-UP popup, anchored above the textarea */
  .popup {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    right: 0;
    max-height: 280px;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid #d4d4d4;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.06);
    padding: 6px;
    display: none;
    z-index: 1000;
  }
  .popup.open { display: block; }

  .item {
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
    user-select: none;
  }
  .item:hover, .item.active {
    background: #f5f5f5;
  }
  .item-slug {
    font-size: 14px;
    font-weight: 500;
    color: #1a1a1a;
  }
  .item-desc {
    font-size: 12px;
    color: #737373;
    line-height: 1.4;
  }
  .item-empty {
    padding: 12px;
    color: #a3a3a3;
    font-size: 13px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="popup" class="popup" role="listbox"></div>
  <textarea
    id="ta"
    rows="2"
    spellcheck="false"
  ></textarea>
  <div class="hint">Press Enter to send · Shift+Enter for newline · @ for skills</div>
</div>

<script>
  // -- Inline minimal Streamlit component protocol --
  // The official streamlit-component-lib is unmaintained (npm's
  // 2.0.0 has no browser bundle, 1.4.0 ships only ESM). Streamlit's
  // component IPC is just postMessage events to/from the parent frame
  // — small enough to inline.
  const RENDER_EVENT = "streamlit:render";
  const COMPONENT_READY = "streamlit:componentReady";
  const SET_VALUE = "streamlit:setComponentValue";
  const SET_FRAME_HEIGHT = "streamlit:setFrameHeight";

  const Streamlit = {
    setComponentReady() {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: COMPONENT_READY, apiVersion: 1 },
        "*"
      );
    },
    setComponentValue(value) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: SET_VALUE, value, dataType: "json" },
        "*"
      );
    },
    setFrameHeight(height) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: SET_FRAME_HEIGHT, height },
        "*"
      );
    },
  };

  // Listen for render events from the host
  window.addEventListener("message", (event) => {
    if (!event.data) return;
    if (event.data.type === RENDER_EVENT) {
      onRender({ detail: { args: event.data.args || {} } });
    }
  });
</script>
<script>
  // Component state
  let skills = [];
  let popupOpen = false;
  let activeIdx = 0;
  let triggerStart = -1; // index in textarea where the active `@` lives

  const ta = document.getElementById("ta");
  const popup = document.getElementById("popup");

  // ------- Streamlit handshake -------
  function onRender(event) {
    const data = event.detail;
    skills = data.args.skills || [];
    ta.placeholder = data.args.placeholder || "Type a message…";
    const targetH = data.args.height || 110;
    Streamlit.setFrameHeight(targetH);
  }
  Streamlit.setComponentReady();

  // Auto-grow the iframe so the popup can extend above without clipping.
  function syncFrameHeight() {
    const popupH = popupOpen ? Math.min(popup.scrollHeight, 280) + 12 : 0;
    const baseH = ta.scrollHeight + 30; // textarea + hint line
    Streamlit.setFrameHeight(baseH + popupH);
  }

  // ------- Popup logic -------
  function findTrigger() {
    // Find the `@` that the cursor is currently anchored to (no whitespace
    // between the @ and the caret). Returns -1 if not in a trigger context.
    const pos = ta.selectionStart;
    const before = ta.value.slice(0, pos);
    const at = before.lastIndexOf("@");
    if (at === -1) return -1;
    // Reject if there's whitespace between the @ and caret
    const between = before.slice(at, pos);
    if (/\s/.test(between)) return -1;
    // @ must be at start or preceded by whitespace
    if (at > 0 && !/\s/.test(before[at - 1])) return -1;
    return at;
  }

  function filterSkills(query) {
    const q = (query || "").toLowerCase();
    if (!q) return skills;
    // Rank tiers (lower number = higher priority):
    //   0: slug starts with q
    //   1: slug contains q
    //   2: name starts with q
    //   3: name contains q
    //   4: description contains q
    const ranked = skills
      .map(s => {
        const slug = s.slug.toLowerCase();
        const name = (s.name || "").toLowerCase();
        const desc = (s.description || "").toLowerCase();
        if (slug.startsWith(q)) return { s, rank: 0 };
        if (slug.includes(q))   return { s, rank: 1 };
        if (name.startsWith(q)) return { s, rank: 2 };
        if (name.includes(q))   return { s, rank: 3 };
        if (desc.includes(q))   return { s, rank: 4 };
        return null;
      })
      .filter(Boolean);
    ranked.sort((a, b) => a.rank - b.rank || a.s.slug.localeCompare(b.s.slug));
    return ranked.map(r => r.s);
  }

  function renderPopup() {
    const at = findTrigger();
    if (at === -1) { closePopup(); return; }
    triggerStart = at;
    const query = ta.value.slice(at + 1, ta.selectionStart);
    const matches = filterSkills(query);

    popup.innerHTML = "";
    if (matches.length === 0) {
      const empty = document.createElement("div");
      empty.className = "item-empty";
      empty.textContent = "No matching skills";
      popup.appendChild(empty);
    } else {
      matches.forEach((s, i) => {
        const div = document.createElement("div");
        div.className = "item" + (i === activeIdx ? " active" : "");
        div.setAttribute("role", "option");
        div.setAttribute("data-slug", s.slug);
        div.title = s.description || s.name || s.slug;  // hover tooltip
        const slug = document.createElement("div");
        slug.className = "item-slug";
        slug.textContent = "@" + s.slug;
        const desc = document.createElement("div");
        desc.className = "item-desc";
        desc.textContent = s.description || s.name || "";
        div.appendChild(slug);
        div.appendChild(desc);
        div.addEventListener("mouseenter", () => {
          activeIdx = i;
          updateActive();
        });
        div.addEventListener("mousedown", (e) => {
          // mousedown rather than click so it fires before textarea blur
          e.preventDefault();
          selectSkill(s.slug);
        });
        popup.appendChild(div);
      });
    }
    if (activeIdx >= matches.length) activeIdx = Math.max(0, matches.length - 1);
    openPopup();
  }

  function updateActive() {
    [...popup.children].forEach((el, i) => {
      el.classList.toggle("active", i === activeIdx);
    });
    // Scroll into view
    const el = popup.children[activeIdx];
    if (el && el.scrollIntoView) {
      el.scrollIntoView({ block: "nearest" });
    }
  }

  function openPopup() {
    popupOpen = true;
    popup.classList.add("open");
    syncFrameHeight();
  }
  function closePopup() {
    popupOpen = false;
    popup.classList.remove("open");
    activeIdx = 0;
    syncFrameHeight();
  }

  function selectSkill(slug) {
    if (triggerStart < 0) return;
    const before = ta.value.slice(0, triggerStart);
    const after = ta.value.slice(ta.selectionStart);
    const inserted = "@" + slug + " ";
    ta.value = before + inserted + after;
    const newCaret = before.length + inserted.length;
    ta.selectionStart = ta.selectionEnd = newCaret;
    closePopup();
    ta.focus();
  }

  function submit() {
    const v = ta.value.trim();
    if (!v) return;
    Streamlit.setComponentValue(v);
    ta.value = "";
    closePopup();
    syncFrameHeight();
  }

  // ------- Keyboard handlers -------
  ta.addEventListener("input", () => {
    syncFrameHeight();
    renderPopup();
  });
  ta.addEventListener("click", () => renderPopup());
  ta.addEventListener("keyup", (e) => {
    // Re-evaluate popup state on caret moves
    if (["ArrowLeft","ArrowRight","Home","End"].includes(e.key)) renderPopup();
  });

  ta.addEventListener("keydown", (e) => {
    if (popupOpen) {
      const items = popup.querySelectorAll(".item");
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (items.length) { activeIdx = (activeIdx + 1) % items.length; updateActive(); }
        return;
      }
      if (e.key === "ArrowUp") {
        e.preventDefault();
        if (items.length) { activeIdx = (activeIdx - 1 + items.length) % items.length; updateActive(); }
        return;
      }
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const items = popup.querySelectorAll(".item");
        if (items.length && items[activeIdx]) {
          selectSkill(items[activeIdx].getAttribute("data-slug"));
        }
        return;
      }
      if (e.key === "Tab") {
        e.preventDefault();
        const items = popup.querySelectorAll(".item");
        if (items.length && items[activeIdx]) {
          selectSkill(items[activeIdx].getAttribute("data-slug"));
        }
        return;
      }
      if (e.key === "Escape") {
        e.preventDefault();
        closePopup();
        return;
      }
    } else {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submit();
        return;
      }
    }
  });

  ta.addEventListener("blur", () => {
    // Small delay so a click on a popup item still fires before close.
    setTimeout(() => { if (!popup.matches(":hover")) closePopup(); }, 100);
  });
</script>
</body>
</html>
